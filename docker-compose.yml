services:
  db:
    image: postgres:16-alpine
    container_name: gabame_clientes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gabame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_local}
      POSTGRES_DB: ${POSTGRES_DB:-clientes_gabame}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gabame} -d ${POSTGRES_DB:-clientes_gabame}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: gabame_clientes_mail
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
